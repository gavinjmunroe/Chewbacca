[package]
name = "hookd"
version = "0.1.0"
edition = "2021"
description = "Chewbacca's hook front door: decides in microseconds whether a guard needs to run at all."
license = "MIT"
publish = false

# No dependencies on purpose: it builds offline on a fresh Mac in seconds, and
# nothing between a tool call and its guards can be broken by a crate update.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
