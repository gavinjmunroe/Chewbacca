[build]
builder = "NIXPACKS"
buildCommand = "npm install"

[deploy]
startCommand = "node Newton/agent/agent.js"
healthcheckPath = "/status"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "amber-agent"

# medha-worker: out-of-band BullMQ worker (audio transcription, GCS
# archive, embeddings). Plumbing only at the moment; no production code
# path enqueues to it yet. Requires REDIS_URL on both services.
#
# If Railway's multi-service detection does not pick this up from a
# single railway.toml, create the service manually in the Railway
# dashboard:
#   1. Project amber, environment Production, "+ New service" -> "Empty Service"
#   2. Name: medha-worker, source: same GitHub repo, branch: main
#   3. Build command: npm install
#   4. Start command: node Newton/worker/index.js
#   5. Set REDIS_URL (same connection string as amber-agent)
[[services]]
name = "medha-worker"
buildCommand = "npm install"
startCommand = "node Newton/worker/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
