name: AmberCircles
options:
  bundleIdPrefix: com.calebnewton.amber
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4DMVHH99R2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "63"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Amber:
    type: application
    platform: iOS
    sources:
      - App
      - path: Shared
    dependencies:
      - target: AmberMessages
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Amber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: Amber listens while you hold the talk button, so you can say what to change instead of typing it.
        NSSpeechRecognitionUsageDescription: Amber turns what you say into words on your phone, so you can talk to what your chat made.
        # iOS reads Face ID permission from the containing app when the
        # extension asks. With it only on the extension, every unlock fell
        # straight to the passcode (Caleb's phone, build 52).
        NSFaceIDUsageDescription: Amber checks it is you before it opens, because it remembers what you have told it.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        CFBundleURLTypes:
          - CFBundleURLName: com.calebnewton.amber
            CFBundleURLSchemes: [amberapp]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calebnewton.amber
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AmberMessages:
    type: app-extension.messages
    platform: iOS
    sources:
      - Messages
      - path: Shared
    info:
      path: Messages/Info.plist
      properties:
        CFBundleDisplayName: Amber
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
        NSMicrophoneUsageDescription: Amber listens while you hold the talk button, so you can say what to change instead of typing it.
        NSSpeechRecognitionUsageDescription: Amber turns what you say into words on your phone, so you can talk to what your chat made.
        NSFaceIDUsageDescription: Amber checks it is you before it opens, because it remembers what you have told it.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    # xcodegen rewrites this file from `properties` on every generate. Listed
    # only as a path, it wrote an empty dict and builds 44 and 45 shipped
    # without Sign in with Apple, so Apple refused on Caleb's phone 2026-09-27.
    entitlements:
      path: Messages/Messages.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # The second group is where the Amber app (amber-ios) keeps its
        # session, so anyone signed in to Amber is signed in here
        # (Messages/AmberLink.swift). The extension's own group stays first,
        # because the first one is where its own keychain items default to.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.calebnewton.amber.messages
          - $(AppIdentifierPrefix)com.joinrytual.amber.shared
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Messages/Messages.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.calebnewton.amber.messages
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: iMessage App Icon
