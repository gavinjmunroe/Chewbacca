<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;width:340px;background:#0a0a0a;color:#fafafa;-webkit-font-smoothing:antialiased}

.header{padding:14px 18px;border-bottom:.5px solid #1f1f23;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#fbbf24,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#0a0a0a;letter-spacing:-.02em;box-shadow:0 4px 12px rgba(245,158,11,.25)}
.brand-name{font-size:13px;font-weight:600;letter-spacing:-.01em;color:#fafafa}
.brand-name span{color:#71717a;font-weight:400;margin-left:5px}
.version{font-size:10px;color:#52525b;font-variant-numeric:tabular-nums;font-weight:500}

.section{padding:14px 14px 4px}
.card{background:#111114;border:.5px solid #1f1f23;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}

.row{display:flex;align-items:center;gap:11px}
.icon-in{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:#0c447c;color:#fff;font-style:italic;letter-spacing:-.02em}
.meta{flex:1;min-width:0}
.label{font-size:13px;font-weight:600;color:#fafafa;letter-spacing:-.005em}
.sub{font-size:11px;color:#a1a1aa;margin-top:2px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-green{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.16)}
.dot-gray{background:#3f3f46}
.dot-amber{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}

.btn{width:100%;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:#f59e0b;color:#0a0a0a;transition:background .12s,opacity .12s;letter-spacing:-.005em;font-family:inherit;text-align:center}
.btn:hover:not(:disabled){background:#fbbf24}
.btn:active:not(:disabled){background:#d97706}
.btn:disabled{background:#1a1a1d;color:#52525b;cursor:not-allowed;border:.5px solid #27272a}

.note{font-size:11px;color:#a1a1aa;line-height:1.5;padding:10px 18px 14px;letter-spacing:.005em}
.note a{color:#fcd34d;text-decoration:none;font-weight:500}
.note a:hover{color:#fde68a;text-decoration:underline}

.toast{margin:0 14px 12px;padding:10px 12px;font-size:11.5px;font-weight:500;display:none;border-radius:9px;line-height:1.4;letter-spacing:.005em}
.toast-success{background:rgba(16,185,129,.1);color:#6ee7b7;border:.5px solid rgba(16,185,129,.3)}
.toast-error{background:rgba(244,63,94,.1);color:#fda4af;border:.5px solid rgba(244,63,94,.3)}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-mark">A</div>
    <div class="brand-name">Amber<span>LinkedIn</span></div>
  </div>
  <div class="version">v1.0</div>
</div>

<div class="section">
  <div class="card">
    <div class="row">
      <div class="icon-in">in</div>
      <div class="meta">
        <div class="label">LinkedIn</div>
        <div class="sub" id="li-sub">Checking status...</div>
      </div>
      <span class="dot dot-gray" id="li-dot"></span>
    </div>
    <button class="btn" id="li-btn" disabled onclick="syncLinkedIn()">Sync</button>
  </div>
</div>

<div class="note" id="note">Make sure you're logged into LinkedIn in this browser.</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
