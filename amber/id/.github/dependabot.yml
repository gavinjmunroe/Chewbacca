# HOW THIS REPO STAYS PATCHED WITHOUT DROWNING IN PULL REQUESTS.
#
# The problem being solved is not "find vulnerabilities" -- GitHub already does
# that, loudly, and it produced 34 alerts nobody could act on because most of
# them were phantoms from a stale node_modules and the rest needed judgement.
# The problem is making the SAFE half automatic so the unsafe half gets read.
#
# The split:
#
#   PATCH + MINOR are grouped into ONE weekly pull request. By semver these do
#   not change APIs, and this repo has 880 tests that run on every PR. If they
#   pass, merging is lower risk than not merging -- an unpatched known flaw is a
#   certainty, a semver-compatible regression is a possibility the suite checks.
#
#   MAJOR versions are IGNORED here on purpose. Every genuinely painful decision
#   in this repo's dependency history was a major: @fastify/static wanted v10 for
#   a package nothing imported, and npm's "fix" for spectrum-ts was a three-major
#   DOWNGRADE that would have broken the iMessage transport. Those need a person
#   who knows what the library is for, one at a time, with the tests watched.
#   Dependabot raising them weekly would train everyone to close them unread.
#
# open-pull-requests-limit is deliberately small. A backlog of dependency PRs is
# indistinguishable from no dependency process at all.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      # One PR for everything safe. Reviewing twenty identical
      # "bump x from 1.2.3 to 1.2.4" PRs is how the process dies.
      safe-updates:
        patterns: ["*"]
        update-types: ["patch", "minor"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # The workflow actions themselves. A stale checkout or setup-node action is a
  # supply-chain surface too, and these never break the app when they update.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
