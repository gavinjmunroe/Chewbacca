[package]
name = "writelog"
version = "0.1.0"
edition = "2021"
description = "write-log in Rust: an FSEvents watcher on the brain, and the hook that reads it instead of running git status before and after every call."
license = "MIT"
publish = false

# No dependencies, the same rule as hookd: it builds offline on a fresh Mac,
# and nothing between a tool call and its write-log can break on a crate update.
[dependencies]

[[bin]]
name = "chewbacca-writelog"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
