name: Deploy PeopleRank

on:
  push:
    branches: [main]
    paths:
      - "domains/peoplerank/**"
      - ".github/workflows/deploy-peoplerank.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domains/peoplerank
    steps:
      - uses: actions/checkout@v4

      - name: Check Railway token
        id: creds
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "RAILWAY_TOKEN not set — skip deploy (reconnect service root to domains/peoplerank)."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.creds.outputs.present == 'true'
        run: npm i -g @railway/cli

      - name: Deploy
        if: steps.creds.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service peoplerank || railway up --ci
