[package]
name = "bashparse"
version = "0.1.0"
edition = "2021"
description = "Reads a shell command with tree-sitter-bash and prints what the shell would run, so guards can tell a command from a word inside data."
license = "MIT"
publish = false

# Unlike hookd and writelog this one has dependencies: a bash grammar is not
# something to hand-roll (the regex readings it backs up are what tonight's
# reviews found 23 bypasses in). Both are pinned in Cargo.lock. If it fails to
# build, every guard keeps its old reading exactly, so a missing binary costs
# precision, never safety.
[dependencies]
tree-sitter = "=0.27.1"
tree-sitter-bash = "=0.25.1"

[[bin]]
name = "chewbacca-bashparse"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
