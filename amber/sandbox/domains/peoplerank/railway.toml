# Railway service config when Root Directory = domains/peoplerank
# Relink source repo to amber-organization/medha-sandbox (not peoplerank-sandbox).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
