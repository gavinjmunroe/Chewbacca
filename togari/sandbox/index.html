<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/bmaicon.png?v=2" />
    <link rel="shortcut icon" type="image/png" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>BMA Wiki</title>
    <meta name="description" content="Internal wiki and team portal for Blue Modern Advisory." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async></script>

    <!-- The app cannot paint until React mounts, so the first frame is the
         stylesheet's light body background. On the dark auth routes that
         reads as a light flash before the shell appears; paint the shell
         gradient on <html> before first paint instead. AuthShell clears it
         on unmount so light routes are unaffected. -->
    <script>
      (function () {
        var p = window.location.pathname;
        if (p === "/login" || p === "/get-started") {
          // Solid color, not the shell gradient: the root box is 0-height
          // until React mounts, so a background-image has no positioning
          // area and paints nothing, while a color fills the canvas.
          document.documentElement.style.background = "#081827";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
