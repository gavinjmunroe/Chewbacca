<!-- Open this file in a browser, right-click each canvas, and save as PNG -->
<!-- Or use the script below to generate them programmatically -->
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.15;
  // Background
  const grad = ctx.createLinearGradient(0, 0, s, s);
  grad.addColorStop(0, '#6366f1');
  grad.addColorStop(1, '#a855f7');
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, r);
  ctx.fillStyle = grad;
  ctx.fill();
  // Letters "NL"
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${s * 0.38}px -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('NL', s / 2, s / 2 + s * 0.02);
}
[16, 48, 128].forEach(size => {
  const c = document.getElementById('c' + size);
  drawIcon(c);
  // Auto-download
  const link = document.createElement('a');
  link.download = 'icon' + size + '.png';
  link.href = c.toDataURL();
  link.click();
});
</script>
