name: Smoke

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PeopleRank test deps
        run: pip install "pydantic>=2" "scikit-learn==1.5.2" "numpy<2.1"

      - name: Smoke + provenance
        run: |
          ./scripts/smoke.sh
          ./scripts/provenance-check.sh
