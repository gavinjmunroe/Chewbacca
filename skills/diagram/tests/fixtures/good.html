<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram gate</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1000px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · diagram skill</p>
    <h1>How a diagram gets shipped</h1>

    <!-- Replace diagram-gate with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagram-gate-title diagram-gate-desc">
        <title id="diagram-gate-title">How a diagram gets shipped</title>
        <desc id="diagram-gate-desc">A request becomes a typed plan, an inline SVG, and passes two local checkers before it ships.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <line x1="208" y1="172" x2="268" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="440" y1="172" x2="500" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="672" y1="172" x2="732" y2="172" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="216" y="152" width="48" height="12" fill="#f5f5f5"/>
        <text x="240" y="161" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">TYPE</text>
        <rect x="448" y="152" width="48" height="12" fill="#f5f5f5"/>
        <text x="472" y="161" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">DRAW</text>
        <rect x="680" y="152" width="48" height="12" fill="#f5f5f5"/>
        <text x="704" y="161" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.12em">CHECK</text>
        <rect x="40" y="140" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="140" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="56" y="168" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Prose ask</text>
        <text x="56" y="186" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">one sentence</text>
        <rect x="272" y="140" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="140" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="288" y="168" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Pick a type</text>
        <text x="288" y="186" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">type + size</text>
        <rect x="504" y="140" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="504" y="140" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="520" y="168" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Inline SVG</text>
        <text x="520" y="186" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">template.html</text>
        <rect x="736" y="140" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="736" y="140" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="752" y="168" fill="#2d3142" font-family="'Geist', sans-serif" font-size="13" font-weight="600">Two checkers</text>
        <text x="752" y="186" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="9">self_check + geometry</text>
        <line x1="40" y1="276" x2="960" y2="276" stroke="rgba(45,49,66,0.15)"/>
        <line x1="40" y1="300" x2="72" y2="300" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="80" y="303" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">STEP</text>
        <line x1="140" y1="300" x2="172" y2="300" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="180" y="303" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">THE GATE THAT DECIDES SHIPPING</text>

      </svg>
    </div>
  </div>
</body>
</html>
