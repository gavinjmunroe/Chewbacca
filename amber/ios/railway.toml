# amber-ios monorepo — Railway deploys only the backend API service
# The iOS app itself is distributed via App Store / TestFlight, not Railway

[build]
builder = "NIXPACKS"
buildCommand = "cd services/app && npm install && npm run build"

[deploy]
startCommand = "cd services/app && npm run start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
