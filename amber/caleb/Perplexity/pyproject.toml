[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-code"
version = "0.7.1"
description = "Perplexity Code: search-native, self-improving coding agent"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.scripts]
perplexity = "perplexity_code.cli:main"

[tool.setuptools]
packages = ["perplexity_code"]
