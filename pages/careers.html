<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Careers, Sift</title>
    <meta name="description" content="Open roles at Sift Labs." />
    <link rel="stylesheet" href="../src/styles.css" />
    <link rel="stylesheet" href="../src/sections/lower.css" />
    <link rel="stylesheet" href="../src/sections/chrome.css" />
    <link rel="stylesheet" href="../src/sections/states.css" />
    <link rel="stylesheet" href="../src/pages/pages.css" />
  </head>
  <body data-nav="careers" data-banner="none">
    <div id="site-chrome"></div>

    <main id="top">
      <div class="pg-frame pg-frame-narrow pg-car">
        <div class="pg-plates" aria-hidden="true">
          <div class="pg-plate pg-plate-a">
            <p>Ship the small fix today</p>
            <span data-fig="wave"></span>
          </div>
          <div class="pg-plate pg-plate-b">
            <p>Read the run before the dashboard</p>
            <span data-fig="orbit"></span>
          </div>
          <div class="pg-plate pg-plate-c">
            <p>Say what broke, then what fixed it</p>
            <span data-fig="field"></span>
          </div>
        </div>

        <div class="pg-car-inner">
          <h1>Help us catch the failures nobody reports.</h1>
          <div class="pg-jobs">
            <a class="pg-job" href="careers/product-engineer.html"
              ><h3>Product Engineer</h3>
              <span>New York or remote, US</span></a
            >
            <a class="pg-job" href="careers/applied-ml-engineer.html"
              ><h3>Applied ML Engineer</h3>
              <span>New York or remote, US</span></a
            >
            <a
              class="pg-job"
              href="mailto:hello@sift.example?subject=A%20failure%20you%20missed"
              ><h3>Show us a failure we would miss</h3>
              <span>hello@sift.example</span></a
            >
          </div>
        </div>
      </div>
    </main>

    <div id="lower-footer"></div>
    <script type="module" src="../src/pages/chrome.js"></script>
  </body>
</html>
